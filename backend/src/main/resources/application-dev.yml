spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:location_db}
    username: ${POSTGRES_USER:location_user}
    password: ${POSTGRES_PASSWORD:location_pwd}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  mail:
    from: noreply@gestion-location.local
    frontend-url: http://localhost:5173
  admin:
    bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:dev-admin-bootstrap}
  pii:
    key: ${APP_PII_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
