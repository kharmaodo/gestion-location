apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gestion-location-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kharmaodo/gestion-location.git
    targetRevision: develop
    path: deploy/helm/gestion-location
    helm:
      valueFiles:
        - values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: location-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
