name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: gestion-location-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend-web
          push: false
          tags: gestion-location-web:ci
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/gestion-location -f deploy/helm/gestion-location/values-dev.yaml
      - run: helm lint deploy/helm/gestion-location -f deploy/helm/gestion-location/values-test.yaml
      - run: helm lint deploy/helm/gestion-location -f deploy/helm/gestion-location/values-prod.yaml
      - run: helm template dev deploy/helm/gestion-location -f deploy/helm/gestion-location/values-dev.yaml >/dev/null
